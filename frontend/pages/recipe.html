<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookify — Recipe</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="navbar"></div>

<div class="container">
  <div id="recipe" class="recipe-detail"></div>

  <div class="recipe-detail">
    <h3>Rate this recipe</h3>
    <div class="stars" id="stars">★★★★★</div>
    <div id="rating-msg"></div>
  </div>

  <div class="recipe-detail">
    <h3>Comments</h3>
    <form id="comment-form" style="margin:16px 0;">
      <textarea id="comment-text" rows="3" placeholder="Write a comment..." required></textarea>
      <button class="btn small" type="submit">Post Comment</button>
    </form>
    <div id="comment-alert"></div>
    <div id="comments"></div>
  </div>
</div>

<div id="footer"></div>
<script src="../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script>
const recipeId = new URLSearchParams(window.location.search).get("id");

async function loadRecipe() {
  const r = await api(`/api/recipes/${recipeId}`);
  document.getElementById("recipe").innerHTML = `
    <span class="badge ${r.recipe_type === 'veg' ? 'veg' : 'nonveg'}">${r.dietary_tag.replace('_', ' ')}</span>
    <h1>${r.title}</h1>
    <div class="meta">
      By <a href="profile.html?id=${r.creator_id}">${r.creator_username}</a>
      · ${r.view_count} views · ${r.rating_count} ratings | Avg ${r.average_rating}
      ${r.food_type ? ' · ' + r.food_type : ''}${r.region ? ' · ' + r.region : ''}
    </div>
    <div class="meta">Speed: ${r.speed}/5 · Difficulty: ${r.difficulty}/5</div>
    ${r.media_url ? `<img class="thumb" style="height:280px; margin-top:12px;" src="${API_BASE}${r.media_url}" />` : ""}
    <p style="margin-top:14px;"><strong>Ingredients:</strong> ${r.ingredients}</p>
    <p><strong>Utensils:</strong> ${r.utensils || "—"}</p>
    <p><strong>Cost:</strong> ₹${r.cost} · <strong>Time:</strong> ${r.cooking_time_minutes} min ·
       <strong>Calories:</strong> ${r.calories} · <strong>Protein:</strong> ${r.protein}g</p>
    <h3 style="margin-top:16px;">Steps</h3>
    <div class="steps">${r.steps}</div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn secondary small" id="subscribe-btn">Subscribe to ${r.creator_username}</button>
      <button class="btn secondary small" id="share-btn">Share Recipe</button>
      ${r.creator_id === getMyUserId() ? `<a class="btn secondary small" href="upload.html?id=${r.id}">Edit recipe</a>` : ""}
    </div>
  `;

  document.getElementById("share-btn").addEventListener("click", async () => {
    // Structure/Dataflow diagrams: Display Recipe -> Share Recipe. Copies a
    // shareable link — no external social API needed for that to be real.
    const url = window.location.href;
    try {
      await navigator.clipboard.writeText(url);
      alert("Link copied to clipboard:\n" + url);
    } catch {
      prompt("Copy this link to share:", url);
    }
  });

  document.getElementById("subscribe-btn").addEventListener("click", async () => {
    requireAuth();
    try {
      const res = await api(`/api/users/${r.creator_id}/subscribe`, { method: "POST", auth: true });
      alert(res.message);
    } catch (err) {
      alert(err.message);
    }
  });
}

async function loadComments() {
  const comments = await api(`/api/recipes/${recipeId}/comments`);
  const el = document.getElementById("comments");
  el.innerHTML = comments.length
    ? comments.map(c => `<div class="comment"><div class="user">User #${c.user_id}</div><div>${c.text}</div></div>`).join("")
    : `<div class="empty-state">No comments yet — be the first.</div>`;
}

document.getElementById("comment-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  requireAuth();
  const alertEl = document.getElementById("comment-alert");
  try {
    await api(`/api/recipes/${recipeId}/comments`, {
      method: "POST", auth: true,
      body: { text: document.getElementById("comment-text").value },
    });
    document.getElementById("comment-text").value = "";
    alertEl.innerHTML = "";
    loadComments();
  } catch (err) {
    alertEl.innerHTML = `<div class="alert error">${err.message}</div>`;
  }
});

document.querySelectorAll("#stars").forEach(starsEl => {
  starsEl.addEventListener("click", async (e) => {
    requireAuth();
    // Simple 1-5 mapping based on click position across the star string.
    const rect = e.target.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const score = Math.max(1, Math.min(5, Math.ceil(pct * 5)));
    try {
      const res = await api(`/api/recipes/${recipeId}/ratings`, { method: "POST", auth: true, body: { score } });
      document.getElementById("rating-msg").innerHTML =
        `<div class="alert success">Rated ${score}/5 — new average: ${res.average_rating}</div>`;
      loadRecipe();
    } catch (err) {
      document.getElementById("rating-msg").innerHTML = `<div class="alert error">${err.message}</div>`;
    }
  });
});

loadRecipe();
loadComments();
</script>
</body>
</html>
