<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookify — Sign Up</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="navbar"></div>

<div class="form-card">
  <h1>Sign Up</h1>
  <div id="alert"></div>
  <form id="signup-form">
    <input type="text" id="username" placeholder="Username" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password (9+ chars, no spaces)" required />
    <input type="password" id="confirm" placeholder="Confirm Password" required />
    <button class="btn" type="submit" style="width:100%;">Confirm Sign Up</button>
  </form>
  <p class="form-note">Already have an account? <a href="login.html">Login</a></p>
</div>

<div id="footer"></div>
<script src="../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script>
document.getElementById("signup-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertEl = document.getElementById("alert");
  alertEl.innerHTML = "";

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  if (password !== confirm) {
    alertEl.innerHTML = `<div class="alert error">Passwords do not match</div>`;
    return;
  }

  try {
    const res = await api("/api/auth/signup", {
      method: "POST",
      body: {
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        password,
      },
    });
    setToken(res.access_token);
    window.location.href = "browse.html";
  } catch (err) {
    alertEl.innerHTML = `<div class="alert error">${err.message}</div>`;
  }
});
</script>
</body>
</html>
