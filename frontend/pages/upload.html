<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookify — Upload / Edit Recipe</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="navbar"></div>

<div class="form-card" style="max-width:520px;">
  <h1 id="page-title">Upload Recipe</h1>
  <div id="alert"></div>
  <form id="upload-form">
    <input type="text" id="title" placeholder="Recipe title" required />
    <textarea id="ingredients" rows="3" placeholder="Ingredients (comma-separated)" required></textarea>
    <input type="text" id="utensils" placeholder="Required utensils/equipment" />
    <textarea id="steps" rows="6" placeholder="Steps — one per line" required></textarea>

    <div style="display:flex; gap:10px;">
      <input type="number" id="cost" placeholder="Cost (₹)" />
      <input type="number" id="time" placeholder="Cook time (min)" />
    </div>
    <div style="display:flex; gap:10px;">
      <input type="number" id="calories" placeholder="Calories" />
      <input type="number" id="protein" placeholder="Protein (g)" />
    </div>

    <select id="dietary_tag">
      <option value="vegetarian">Vegetarian</option>
      <option value="eggetarian">Eggetarian</option>
      <option value="pescetarian">Pescetarian</option>
      <option value="jain">Jain</option>
      <option value="non_vegetarian">Non-Vegetarian</option>
    </select>

    <div style="display:flex; gap:10px;">
      <input type="text" id="food_type" placeholder="Food type (appetizer, bread, dessert...)" />
      <input type="text" id="region" placeholder="Cuisine (pan-Asian, English...)" />
    </div>

    <label style="font-size:13px; display:block; margin:6px 0 2px;">Speed: <span id="speed-val">3.0</span> / 5</label>
    <input type="range" id="speed" min="0.5" max="5" step="0.5" value="3" style="border-radius:0; background:transparent; padding:0; margin-bottom:14px;"
      oninput="document.getElementById('speed-val').textContent = this.value" />

    <label style="font-size:13px; display:block; margin:6px 0 2px;">Difficulty: <span id="difficulty-val">3.0</span> / 5</label>
    <input type="range" id="difficulty" min="0.5" max="5" step="0.5" value="3" style="border-radius:0; background:transparent; padding:0; margin-bottom:14px;"
      oninput="document.getElementById('difficulty-val').textContent = this.value" />

    <input type="file" id="media" accept="image/*,video/*" style="border-radius:8px; background:transparent; border:1px dashed var(--border);" />

    <button class="btn" type="submit" id="submit-btn" style="width:100%; margin-top:14px;">Submit Recipe</button>
  </form>
</div>

<div id="footer"></div>
<script src="../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script>
requireAuth();

// Structure Diagram: Display Recipe -> Edit recipe, reusing this same page
// (the wireframe literally labels it "Recipe Upload / Edit"). ?id= present
// means edit mode: prefill fields and PUT instead of POST.
const editId = new URLSearchParams(window.location.search).get("id");

async function prefillForEdit() {
  const r = await api(`/api/recipes/${editId}`);
  document.getElementById("page-title").textContent = "Edit Recipe";
  document.getElementById("submit-btn").textContent = "Save Changes";
  document.getElementById("title").value = r.title;
  document.getElementById("ingredients").value = r.ingredients;
  document.getElementById("utensils").value = r.utensils;
  document.getElementById("steps").value = r.steps;
  document.getElementById("cost").value = r.cost;
  document.getElementById("time").value = r.cooking_time_minutes;
  document.getElementById("calories").value = r.calories;
  document.getElementById("protein").value = r.protein;
  document.getElementById("dietary_tag").value = r.dietary_tag;
  document.getElementById("food_type").value = r.food_type;
  document.getElementById("region").value = r.region;
  document.getElementById("speed").value = r.speed;
  document.getElementById("speed-val").textContent = r.speed;
  document.getElementById("difficulty").value = r.difficulty;
  document.getElementById("difficulty-val").textContent = r.difficulty;
}
if (editId) prefillForEdit();

document.getElementById("upload-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertEl = document.getElementById("alert");
  alertEl.innerHTML = "";

  const form = new FormData();
  form.append("title", document.getElementById("title").value);
  form.append("ingredients", document.getElementById("ingredients").value);
  form.append("utensils", document.getElementById("utensils").value);
  form.append("steps", document.getElementById("steps").value);
  form.append("cost", document.getElementById("cost").value || 0);
  form.append("cooking_time_minutes", document.getElementById("time").value || 0);
  form.append("calories", document.getElementById("calories").value || 0);
  form.append("protein", document.getElementById("protein").value || 0);
  form.append("dietary_tag", document.getElementById("dietary_tag").value);
  form.append("food_type", document.getElementById("food_type").value);
  form.append("region", document.getElementById("region").value);
  form.append("speed", document.getElementById("speed").value);
  form.append("difficulty", document.getElementById("difficulty").value);
  const media = document.getElementById("media").files[0];
  if (media) form.append("media", media);

  try {
    const res = editId
      ? await api(`/api/recipes/${editId}`, { method: "PUT", auth: true, form })
      : await api("/api/recipes", { method: "POST", auth: true, form });
    window.location.href = `recipe.html?id=${res.recipe.id}`;
  } catch (err) {
    alertEl.innerHTML = `<div class="alert error">${err.message}</div>`;
  }
});
</script>
</body>
</html>
