<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookify — Profile</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="navbar"></div>

<div class="container">
  <div class="recipe-detail" id="profile"></div>

  <div class="recipe-detail" id="edit-panel" style="display:none;">
    <h3>Edit Profile</h3>
    <form id="edit-form">
      <textarea id="bio" rows="2" placeholder="Bio"></textarea>
      <input type="number" id="age" placeholder="Age" style="max-width:120px;" />
      <input type="file" id="pfp" accept="image/*" style="border-radius:8px; background:transparent; border:1px dashed var(--border);" />
      <button class="btn small" type="submit">Save</button>
    </form>
  </div>

  <h2 style="margin:20px 0 10px;">Uploaded Recipes</h2>
  <div id="recipes" class="recipe-grid"></div>

  <!-- Wireframe callout: "Inverted Yellow Brown Colour Scheme" distinguishes
       Saved Recipes from Uploaded Recipes — swapped card/badge tones below. -->
  <h2 style="margin:20px 0 10px;">Saved Recipes</h2>
  <div id="saved-recipes" class="recipe-grid"></div>
</div>

<div id="footer"></div>
<script src="../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script>
// Navbar always links here with ?id=<my_id> (see navbar.js / getMyUserId());
// recipe cards link with the recipe creator's id — so this page always
// receives an explicit id rather than guessing "current user".
const params = new URLSearchParams(window.location.search);
let profileId = params.get("id");

async function init() {
  if (!profileId) {
    window.location.href = "browse.html";
    return;
  }
  const p = await api(`/api/users/${profileId}`);
  document.getElementById("profile").innerHTML = `
    <div style="display:flex; gap:20px; align-items:center;">
      ${p.profile_picture_url
        ? `<img src="${API_BASE}${p.profile_picture_url}" style="width:80px; height:80px; border-radius:50%; object-fit:cover;" />`
        : `<div style="width:80px; height:80px; border-radius:50%; background:#eee;"></div>`}
      <div>
        <h1>${p.username}</h1>
        <div class="meta">${p.first_name || ""} ${p.last_name || ""}${p.age ? ' · Age ' + p.age : ''}</div>
        <div class="meta">${p.followers} followers · ${p.following} following</div>
      </div>
    </div>
    <p style="margin-top:14px;">${p.bio || "No bio yet."}</p>
    ${parseInt(profileId, 10) !== getMyUserId() ? `<a class="btn small secondary" href="chat.html?user=${profileId}">Message</a>` : ""}
  `;

  const recipesEl = document.getElementById("recipes");
  recipesEl.innerHTML = p.uploaded_recipes.length
    ? p.uploaded_recipes.map(r => `
      <div class="recipe-card ${r.recipe_type === 'veg' ? 'veg' : ''}">
        <div class="title">${r.title}</div>
        <div class="rating">${r.rating_count} ratings | Avg ${r.average_rating}</div>
        <a class="btn small" href="recipe.html?id=${r.id}">Open recipe</a>
      </div>`).join("")
    : `<div class="empty-state">No recipes uploaded yet.</div>`;

  const savedEl = document.getElementById("saved-recipes");
  savedEl.innerHTML = p.saved_recipes.length
    ? p.saved_recipes.map(r => `
      <div class="recipe-card saved">
        <div class="title">${r.title}</div>
        <div class="rating">${r.rating_count} ratings | Avg ${r.average_rating}</div>
        <a class="btn small secondary" href="recipe.html?id=${r.id}">Open recipe</a>
      </div>`).join("")
    : `<div class="empty-state">No saved recipes yet.</div>`;

  if (parseInt(profileId, 10) === getMyUserId()) {
    document.getElementById("edit-panel").style.display = "block";
    document.getElementById("bio").value = p.bio || "";
    document.getElementById("age").value = p.age || "";
  }
}

document.getElementById("edit-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  requireAuth();
  const form = new FormData();
  form.append("bio", document.getElementById("bio").value);
  form.append("age", document.getElementById("age").value || "");
  const pfp = document.getElementById("pfp").files[0];
  if (pfp) form.append("profile_picture", pfp);
  try {
    await api("/api/users/me", { method: "PUT", auth: true, form });
    init();
  } catch (err) {
    alert(err.message);
  }
});

init();
</script>
</body>
</html>
