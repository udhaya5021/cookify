<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookify — Reset Password</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="navbar"></div>

<div class="form-card">
  <h1>Forgot Password?</h1>
  <div id="alert"></div>
  <form id="reset-form">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="new-password" placeholder="New Password (9+ chars, no spaces)" required />
    <button class="btn" type="submit" style="width:100%;">Confirm New Password</button>
  </form>
  <p class="form-note"><a href="login.html">Back to Login</a></p>
</div>

<div id="footer"></div>
<script src="../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script>
document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertEl = document.getElementById("alert");
  try {
    await api("/api/auth/forgot-password", {
      method: "POST",
      body: {
        email: document.getElementById("email").value,
        new_password: document.getElementById("new-password").value,
      },
    });
    alertEl.innerHTML = `<div class="alert success">Password reset — you can log in now.</div>`;
  } catch (err) {
    alertEl.innerHTML = `<div class="alert error">${err.message}</div>`;
  }
});
</script>
</body>
</html>
